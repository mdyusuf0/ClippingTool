# ClipFinder default configuration
# Override any value via CLI flags or --config path

defaults:
  clips: 5
  min: 15
  max: 45
  style: blur        # blur | crop | facecrop
  captions: bold     # bold | pop | minimal
  model: base        # tiny | base | small | medium | large-v2
  language: auto     # auto | en | es | fr | hi | ar | ...
  output: output/
  crf: 20
  preset: veryfast     # ffmpeg x264 preset (veryfast recommended for speed without loss of quality at crf 20)
  audio_bitrate: 192k
  target_lufs: -14
  live_duration: 2.0  # default minutes to capture for live broadcasts

presets:
